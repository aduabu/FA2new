name: Enterprise ERP CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Type check TypeScript
        run: |
          cd apps/web
          npm run typecheck

      - name: Build React SPA
        run: |
          cd apps/web
          npm run build

  api-validation:
    name: API & Core PHP Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli, gd

      - name: Lint PHP Syntax
        run: |
          find FA-Source -name "*.php" -exec php -l {} \;
          find FA-Source -name "*.inc" -exec php -l {} \;
