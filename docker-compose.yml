version: '3.8'

services:
  # MySQL 8.0 Database Engine
  db:
    image: mysql:8.0
    container_name: fa_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: frontacct
      MYSQL_USER: fa_user
      MYSQL_PASSWORD: fa_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./FA-Source/sql/en_US-new.sql:/docker-entrypoint-initdb.d/01_schema.sql

  # Redis 7 Cache & Worker Queue
  redis:
    image: redis:7-alpine
    container_name: fa_redis
    restart: always
    ports:
      - "6379:6379"

  # PHP REST API Gateway (Wrapping FA Core)
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: fa_api
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: frontacct
      DB_USER: fa_user
      DB_PASS: fa_password
      REDIS_HOST: redis
      JWT_SECRET: super_secret_enterprise_jwt_key_2026
    volumes:
      - ./FA-Source:/var/www/html/FA-Source
      - ./apps/api:/var/www/html/api
    depends_on:
      - db
      - redis

  # React 19 SPA Frontend Dev Server
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: fa_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db_data:
