version: '3.8'

services:
  # 1. MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: fa-enterprise-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: frontacct
      MYSQL_USER: fa_user
      MYSQL_PASSWORD: fa_password
      MYSQL_ROOT_PASSWORD: fa_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fa_user", "-pfa_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Redis 7 Cache & Worker Queue Service
  redis:
    image: redis:7-alpine
    container_name: fa-enterprise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. PHP 8.2 Apache REST API Gateway
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: fa-enterprise-api
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_USER: fa_user
      DB_PASS: fa_password
      DB_NAME: frontacct
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. React 19 SPA Web Frontend
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: fa-enterprise-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
